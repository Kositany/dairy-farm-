<!DOCTYPE html>
<html lang="en">
<head>

<title>Dairy Farm Manager</title>
<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}

main{width:100%;max-width:1180px;margin:0 auto;padding:22px 16px 24px}
h1{font-size:1.65rem;line-height:1.2;margin:8px 0 4px}
h2{font-size:1.05rem;margin:24px 0 10px}
.sub{color:var(--muted);margin:0 0 16px}
.mobile-toolbar{position:sticky;top:0;z-index:7;display:flex;align-items:stretch;min-height:48px;background:var(--surface);border-bottom:1px solid var(--line)}
.storage-bar{position:static;flex:1;min-width:0}
.menu-toggle{display:flex;flex:0 0 48px;align-items:center;justify-content:center;min-height:48px;padding:8px;border:0;border-radius:0;background:var(--surface);color:var(--ink);cursor:pointer}
nav{position:absolute;top:100%;right:10px;left:auto;bottom:auto;display:none;flex-direction:column;width:min(280px,calc(100vw - 20px));gap:4px;padding:8px;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 12px 30px rgba(0,0,0,.35)}
body.nav-open nav{display:flex}
nav button{display:flex;min-width:0;min-height:44px;flex-direction:row;align-items:center;justify-content:flex-start;gap:12px;padding:8px 12px;border:0;border-radius:6px;background:none;color:var(--muted);font:inherit;font-size:.92rem;font-weight:600;cursor:pointer}
nav button svg{width:20px;height:20px}
nav button[aria-current="page"]{color:var(--accent);background:var(--surface-raised)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{touch-action:manipulation}
.datebar{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.datebar button{width:44px;min-height:44px;padding:8px}
input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px;width:100%;min-height:44px}
label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}
.stat.big{grid-column:1/-1;background:var(--milk);border-color:transparent}
.stat b{display:block;font-size:1.8rem;line-height:1.15;overflow-wrap:anywhere}
.stat.big b{font-size:clamp(2rem,7vw,3rem)}
.stat span{color:var(--muted);font-size:.88rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.form .full{grid-column:1/-1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:11px 15px;font:inherit;font-weight:700;cursor:pointer;min-height:44px}
.btn svg,.ghost svg,.del svg{width:18px;height:18px;flex:none}
.ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;background:none;border:1px solid var(--line);color:var(--ink);border-radius:8px;cursor:pointer;font:inherit;padding:9px 12px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.admin-search{max-width:420px;margin:4px 0 12px}
.admin-cow{padding:14px 0;border-bottom:1px solid var(--line)}
.admin-cow:last-child{border-bottom:0}
.cow-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.cow-head h3{margin:0;font-size:1rem}
.cow-head small,.cow-facts,.activity-row{color:var(--muted)}
.cow-facts{display:flex;flex-wrap:wrap;gap:6px 16px;margin:8px 0;font-size:.85rem}
.cow-facts b{color:var(--ink)}
.admin-cow details{margin-top:8px}
.admin-cow summary{color:var(--accent);cursor:pointer;font-size:.9rem;font-weight:600;min-height:36px;padding:6px 0}
.record-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin:8px 0}
.activity-group h4{margin:8px 0;color:var(--ink);font-size:.88rem}
.activity-row{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:.82rem}
.activity-row b{color:var(--ink);white-space:nowrap}
.cow-actions{display:flex;align-items:center;gap:8px}
.cow-actions .ghost{color:var(--danger);min-height:38px;padding:6px 10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row small{color:var(--muted);display:block;overflow-wrap:anywhere}
.del{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border:0;border-radius:8px;background:transparent;color:var(--danger);cursor:pointer;padding:8px}
.del:hover,.ghost:hover{background:var(--surface-raised)}
.empty{color:var(--muted);padding:12px 0}
.notice{padding:12px;border:1px solid var(--line);border-radius:8px;color:var(--muted);font-size:.9rem}
.storage-bar{position:sticky;top:0;z-index:6;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 14px;background:#20332d;border-bottom:1px solid var(--line);color:var(--ink);font-size:.82rem}
.storage-bar[data-state="error"],.storage-bar[data-state="temporary"]{background:#462b25;color:#ffe4d8}
.storage-bar[data-state="saving"]{background:#36331d;color:#fff4c2}
.storage-bar button{border:1px solid currentColor;border-radius:6px;padding:5px 9px;background:transparent;color:inherit;font:inherit;cursor:pointer}
.startup{max-width:720px;margin:12vh auto;padding:24px}
.startup h1{margin-top:0}
.startup .actions{margin-top:16px}
.startup-status{min-height:1.5em;color:var(--muted)}
.field-error{color:var(--danger)}
.backup-reminder{background:#39331f;border-color:#85743b}
dialog{width:min(560px,calc(100vw - 24px));max-height:90vh;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.68)}
dialog h2{margin:0 0 16px}
dialog .actions{margin-top:16px}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 7px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:.85rem}
td.n,th.n{text-align:right}
svg text{fill:var(--muted);font-size:10px}
.icon{width:20px;height:20px;vertical-align:middle}
@media print{body{display:block;background:#fff;color:#111;font:12pt/1.4 Arial,sans-serif}.mobile-toolbar,nav,button,input,select,.datebar{display:none!important}main{max-width:none;padding:0;margin:0}h1,h2,.sub,th,td,.stat span{color:#111}.card,.stat{break-inside:avoid;background:#fff;border:1px solid #999;box-shadow:none}.scroll{overflow:visible}table{width:100%}th,td{white-space:normal;border-color:#aaa}svg text{fill:#111}}

@media(max-width:600px){.record-grid{grid-template-columns:1fr}.cow-head{gap:8px}.cow-facts{gap:4px 12px}}

</style>
</head>

function validData(data){if(!data||typeof data!=="object"||Array.isArray(data))throw new Error("Invalid JSON database.");

  Object.keys(data).filter(function(k){return keys.indexOf(k)===-1&&k!=="quarantine"&&k!=="farmProfile"}).forEach(function(k){invalid.push({collection:"unknown",index:-1,reason:"Unknown top-level data preserved for review.",record:{field:k,value:data[k]}})});
  var cowIds={};out.cows.forEach(function(c){cowIds[c.id]=true});var missing=[];["milk","feed","weight","breed"].forEach(function(k){out[k].forEach(function(x){if(!cowIds[x.cow])missing.push({collection:k,id:x.id,cowId:x.cow})})});
  quarantine=invalid.concat(missing.map(function(x){return{collection:x.collection,reason:"Referenced cow profile is missing; activity record retained.",record:x}}));if(data.quarantine&&Array.isArray(data.quarantine))quarantine=quarantine.concat(data.quarantine);
  validationWarnings={invalid:invalid.length,missingCowReferences:missing.length};return out}
var validationWarnings={invalid:0,missingCowReferences:0};
function checkRecord(k,x){function text(v,n,required){return typeof v==="string"&&v.length<=n&&(!required||!!v.trim())}function validDate(v){if(typeof v!=="string"||!/^\d{4}-\d{2}-\d{2}$/.test(v))return false;var parts=v.split("-").map(Number),d=new Date(parts[0],parts[1]-1,parts[2]);if(d.getFullYear()!==parts[0]||d.getMonth()!==parts[1]-1||d.getDate()!==parts[2])return false;return d.getTime()<=new Date(shift(today(),365)+"T23:59:59").getTime()}
  if(k==="cows")return text(x.tag,50,true)&&text(x.name||"",80,false)&&text(x.breed||"",80,false)&&(!x.archivedAt||validDate(x.archivedAt));
  if(k==="calves")return text(x.number,50,true)&&Number.isInteger(x.ageMonths)&&x.ageMonths>=0&&x.ageMonths<=1200;

function parseBulkCowRows(text,existing){var rows=[],seen={};var lines=String(text||"").split(/\r?\n/);for(var i=0;i<lines.length;i++){var line=lines[i].trim();if(!line)continue;var columns=line.split(line.indexOf("\t")!==-1?"\t":",").map(function(value){return value.trim()});if(columns.length>3)return{rows:[],error:"Line "+(i+1)+": use tag, optional name, and optional breed."};var tag=columns[0]||"",name=columns[1]||"",breed=columns[2]||"";if(!tag||tag.length>50||name.length>80||breed.length>80)return{rows:[],error:"Line "+(i+1)+": tag is required (50 characters max); name and breed may be up to 80 characters."};var key=tag.toLowerCase();if(seen[key]||(existing||[]).some(function(c){return !c.archivedAt&&c.tag.toLowerCase()===key}))return{rows:[],error:"Line "+(i+1)+": tag \""+tag+"\" already belongs to an active cow or appears more than once."};seen[key]=true;rows.push({tag:tag,name:name,breed:breed})}return rows.length?{rows:rows,error:""}:{rows:[],error:"Enter at least one cow."}}
function addCowsBulk(){bulkCowDraft=$v("bulkCows");var parsed=parseBulkCowRows(bulkCowDraft,S.cows);if(parsed.error){msg=parsed.error;return draw()}var previous=clone(S);parsed.rows.forEach(function(row){S.cows.push({id:uid(),tag:row.tag,name:row.name,breed:row.breed,archivedAt:null})});return saveAndDraw(previous,parsed.rows.length+" cows added.","Before adding "+parsed.rows.length+" cows").then(function(ok){if(ok){bulkCowDraft="";draw()}return ok})}
function saveCowEdit(id){var c=cow(id),tag=$v("editTag_"+id),name=$v("editName_"+id),breed=$v("editBreed_"+id);if(!c||!tag||tag.length>50||name.length>80||breed.length>80){msg="Check the cow tag, name, and breed lengths.";return draw()}if(!c.archivedAt&&S.cows.some(function(x){return x.id!==id&&!x.archivedAt&&x.tag.toLowerCase()===tag.toLowerCase()})){msg="That tag already belongs to an active cow.";return draw()}var previous=clone(S);c.tag=tag;c.name=name;c.breed=breed;return saveAndDraw(previous,"Cow profile updated.")}
function saveCalfEdit(id){var c=S.calves.find(function(x){return x.id===id}),number=$v("editCalfNumber_"+id),ageText=$v("editCalfAge_"+id),age=Number(ageText);if(!c||!ageText||!checkRecord("calves",{id:id,number:number,ageMonths:age})){msg="Enter a calf number and a whole age in months (0–1,200).";return draw()}if(S.calves.some(function(x){return x.id!==id&&x.number.toLowerCase()===number.toLowerCase()})){msg="That calf number is already in use.";return draw()}var previous=clone(S);c.number=number;c.ageMonths=age;return saveAndDraw(previous,"Calf details updated.","Before updating calf "+number)}
function restoreCow(id){var c=cow(id);if(!c)return;if(S.cows.some(function(x){return x.id!==id&&!x.archivedAt&&x.tag.toLowerCase()===c.tag.toLowerCase()})){msg="Restore blocked: another active cow already uses this tag.";return draw()}var previous=clone(S);c.archivedAt=null;return saveAndDraw(previous,"Cow restored to the active herd.")}
function saveFarmProfile(){var profile={name:$v("farmName")||"Dairy Farm",locale:$v("farmLocale"),timeZone:$v("farmTimezone"),milkUnit:$v("farmMilkUnit"),weightUnit:$v("farmWeightUnit"),feedUnit:$v("farmFeedUnit")};if(profile.name.length>100||profile.locale.length>35||profile.timeZone.length>80){msg="Check farm profile field lengths.";return draw()}try{new Intl.DateTimeFormat(profile.locale,{timeZone:profile.timeZone}).format(new Date())}catch(e){msg="Enter a supported locale and timezone, such as en-KE and Africa/Nairobi.";return draw()}var old=clone(farmProfile);farmProfile=profile;return save().then(function(ok){if(!ok)farmProfile=old;msg=ok?"Farm profile saved.":storageMessage;draw()})}
function addMilk(){var entered=parseFloat($v("ml"));if(!(entered>=0)||$v("ml")===""){msg="Enter the milk amount.";return draw()}var l=inputMeasure(entered,"milk");
  var record={id:uid(),date:day,cow:$v("mc"),s:$v("ms"),l:l};if(!checkRecord("milk",record)){msg="Check the date, cow, session, and amount range.";return draw()}if(!confirmRecordWarnings("milk",record))return;var previous=clone(S);S.milk.push(record);return saveAndDraw(previous,"Milk record saved.")}
function addFeed(){var entered=parseFloat($v("fk"));if(!(entered>=0)||$v("fk")===""){msg="Enter the feed amount.";return draw()}var k=inputMeasure(entered,"feed");
  var record={id:uid(),date:day,cow:$v("fc"),t:$v("ft"),kg:k};if(!checkRecord("feed",record)){msg="Check the date, cow, feed type, and amount range.";return draw()}if(!confirmRecordWarnings("feed",record))return;var previous=clone(S);S.feed.push(record);return saveAndDraw(previous,"Feed record saved.")}
function saveAndDraw(previous,success,reason){var snapshot=clone(S);return Promise.resolve(reason?createSnapshot(reason,previous):null).then(function(){return save()}).then(function(ok){if(!ok){if(JSON.stringify(S)===JSON.stringify(snapshot))S=previous;msg=storageMessage||"Save failed. Your previous data is still available."}else{msg=success;if(reason){lastUndo={data:clone(previous),quarantine:clone(quarantine),farmProfile:clone(farmProfile),expires:Date.now()+10000};setStorageState(storageState,storageMessage);var token=lastUndo;setTimeout(function(){if(lastUndo===token){lastUndo=null;setStorageState(storageState,storageMessage)}},10000)}}draw();return ok}).catch(function(e){S=previous;msg="Could not create a safety snapshot: "+e.message;setStorageState("error",msg);draw();return false})}
async function undoLastAction(){var undo=lastUndo;if(!undo||undo.expires<Date.now()){lastUndo=null;setStorageState(storageState,storageMessage);return}var current=clone(S),currentQ=clone(quarantine),currentProfile=clone(farmProfile);S=clone(undo.data);quarantine=clone(undo.quarantine);farmProfile=clone(undo.farmProfile);var ok=await save();if(!ok){S=current;quarantine=currentQ;farmProfile=currentProfile;msg=storageMessage||"Undo failed; current data was retained."}else{lastUndo=null;msg="Last change undone.";setStorageState("saved",msg)}draw()}
function del(k,id){var previous=clone(S);S[k]=S[k].filter(function(x){return x.id!==id});return saveAndDraw(previous,"Record deleted.","Before deleting a "+k+" record")}
function delCow(id){var c=cow(id);if(c&&!c.archivedAt&&confirm("Archive this cow? Its profile and all historical records will be retained and can be restored.")){var previous=clone(S);c.archivedAt=today();return saveAndDraw(previous,"Cow archived; historical records were kept.","Before archiving cow "+c.tag)}}
function permanentlyDeleteCow(id){var c=cow(id);if(!c||!c.archivedAt)return;var kinds=["milk","feed","weight","breed"],count=kinds.reduce(function(n,k){return n+S[k].filter(function(x){return x.cow===id}).length},0),typed=prompt("Permanently delete cow "+c.tag+" and its "+count+" linked activity records? This cannot be undone. Type the cow tag exactly to confirm.");if(typed!==c.tag){msg="Permanent deletion cancelled; no data was changed.";return draw()}var previous=clone(S);S.cows=S.cows.filter(function(x){return x.id!==id});kinds.forEach(function(k){S[k]=S[k].filter(function(x){return x.cow!==id})});return saveAndDraw(previous,"Cow and "+count+" linked records permanently deleted.","Before permanent deletion of cow "+c.tag)}
function $v(i){var e=document.getElementById(i);return e?e.value.trim():""}
function displayNumber(n,kind){var value=n;if(kind==="milk"&&farmProfile.milkUnit==="US gal")value=n/3.785411784;if(kind!=="milk"&&(kind==="weight"?farmProfile.weightUnit:farmProfile.feedUnit)==="lb")value=n*2.2046226218;return String(Math.round(value*100)/100)}
function optionList(values,selected){return values.map(function(v){return'<option value="'+esc(v)+'"'+(v===selected?' selected':'')+'>'+esc(v)+'</option>'}).join("")}
function editRecord(kind,id){var row=S[kind].find(function(x){return x.id===id}),dialog=document.getElementById("recordDialog");if(!row||!dialog)return;var cows=S.cows.map(function(c){return'<option value="'+esc(c.id)+'"'+(c.id===row.cow?' selected':'')+'>'+cname(c.id)+(c.archivedAt?' (archived)':'')+'</option>'}).join("");if(!cow(row.cow))cows+='<option value="'+esc(row.cow)+'" selected>Missing cow · '+esc(row.cow)+'</option>';var fields='<div><label for="editRecordDate">Date</label><input id="editRecordDate" type="date" value="'+esc(row.date)+'" required></div><div><label for="editRecordCow">Cow</label><select id="editRecordCow">'+cows+'</select></div>';
  if(kind==="milk")fields+='<div><label for="editRecordSession">Milking session</label><select id="editRecordSession">'+optionList(["Morning","Midday","Evening"],row.s)+'</select></div><div><label for="editRecordAmount">Amount ('+esc(farmProfile.milkUnit)+')</label><input id="editRecordAmount" type="number" min="0" step="0.1" value="'+displayNumber(row.l,"milk")+'" required></div>';
  if(kind==="feed")fields+='<div><label for="editRecordType">Feed type</label><select id="editRecordType">'+optionList(FEEDS,row.t)+'</select></div><div><label for="editRecordAmount">Amount ('+esc(farmProfile.feedUnit)+')</label><input id="editRecordAmount" type="number" min="0" step="0.1" value="'+displayNumber(row.kg,"feed")+'" required></div>';
  if(kind==="weight")fields+='<div class="full"><label for="editRecordAmount">Weight ('+esc(farmProfile.weightUnit)+')</label><input id="editRecordAmount" type="number" min="0" step="0.1" value="'+displayNumber(row.kg,"weight")+'" required></div>';
  if(kind==="breed")fields+='<div class="full"><label for="editRecordType">Breeding event</label><select id="editRecordType">'+optionList(EV,row.t)+'</select></div><div><label for="editRecordBull">Bull or semen</label><input id="editRecordBull" maxlength="120" value="'+esc(row.b||'')+'"></div><div><label for="editRecordNotes">Notes</label><input id="editRecordNotes" maxlength="1000" value="'+esc(row.n||'')+'"></div>';
  var title={milk:"Edit milk record",feed:"Edit feed record",weight:"Edit weight record",breed:"Edit breeding event"}[kind];dialog.innerHTML='<form onsubmit="event.preventDefault();saveEditedRecord()"><h2 id="recordDialogTitle">'+title+'</h2><div class="form">'+fields+'</div><p id="recordEditError" class="field-error" role="alert"></p><div class="actions"><button class="btn" type="submit">Save changes</button><button class="ghost" type="button" onclick="closeRecordEditor()">Cancel</button></div><input id="editRecordKind" type="hidden" value="'+kind+'"><input id="editRecordId" type="hidden" value="'+esc(id)+'"></form>';dialog.showModal();var focus=dialog.querySelector("input:not([type=hidden]),select");if(focus)focus.focus()}
function closeRecordEditor(){var dialog=document.getElementById("recordDialog");if(dialog&&dialog.open)dialog.close()}
function saveEditedRecord(){var kind=$v("editRecordKind"),id=$v("editRecordId"),row=S[kind]&&S[kind].find(function(x){return x.id===id});if(!row)return;var candidate=clone(row),amount=parseFloat($v("editRecordAmount"));candidate.date=$v("editRecordDate");candidate.cow=$v("editRecordCow");if(kind==="milk"){candidate.s=$v("editRecordSession");candidate.l=inputMeasure(amount,"milk")}if(kind==="feed"){candidate.t=$v("editRecordType");candidate.kg=inputMeasure(amount,"feed")}if(kind==="weight")candidate.kg=inputMeasure(amount,"weight");if(kind==="breed"){candidate.t=$v("editRecordType");candidate.b=$v("editRecordBull");candidate.n=$v("editRecordNotes")}if(!checkRecord(kind,candidate)){var error=document.getElementById("recordEditError");if(error)error.textContent="These values do not match the record rules. Check the date, cow, amount, and text lengths.";return}if(!confirmRecordWarnings(kind,candidate,id))return;var previous=clone(S),index=S[kind].findIndex(function(x){return x.id===id});S[kind][index]=candidate;closeRecordEditor();return saveAndDraw(previous,"Record updated.","Before editing a "+kind+" record")}

function draw(){
  ensureCollections(S);recordIndexCache=buildRecordIndex();
  var v={today:vToday,milk:vMilk,feed:vFeed,weight:vWeight,breed:vBreed,cows:vCows,calves:vCalves,admin:vAdmin}[tab]();
  document.getElementById("app").innerHTML=v;
  var csv=document.getElementById("csvCollection");if(csv){var calfOption=document.createElement("option");calfOption.value="Calves";calfOption.textContent="Calves";csv.appendChild(calfOption)}
  var n=[["today","Today","today"],["milk","Milk","milk"],["feed","Feed","feed"],["weight","Weight","weight"],["breed","Breeding","breed"],["cows","Cows","cows"],["calves","Calves","cows"],["admin","Admin","admin"]];
  document.getElementById("nav").innerHTML=n.map(function(x){return '<button onclick="setTab(\''+x[0]+'\')"'+(tab===x[0]?' aria-current="page"':'')+'>'+icon(x[2])+'<span>'+x[1]+'</span></button>'}).join("")}
startApp();
</script>
